<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <title>PA#3</title>
    <style>
      body {
        background-color: #eeeeee;
      }
    </style>

    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./model.js"></script>
    <script src="./main.js"></script>
  </head>
  <body onload="init()">
    <p id="message">
      Drag your mouse on the cube to rotate it.<br />
      (On a touch screen, you can use your finger.)
    </p>
    <input
      type="range"
      id="uGranularity"
      min="1"
      max="100"
      value="25"
      oninput="updateSurface()"
    />
    <input
      type="range"
      id="vGranularity"
      min="1"
      max="100"
      value="25"
      oninput="updateSurface()"
    />

    <div style="margin-top: 10px">
      <label>Center U (0.0 - 1.0):</label>
      <input
        type="number"
        id="centerU"
        value="0.5"
        step="0.01"
        min="0"
        max="1"
        oninput="updateCenterFromInput()"
      />
      <br />
      <label>Center V (0.0 - 1.0):</label>
      <input
        type="number"
        id="centerV"
        value="0.5"
        step="0.01"
        min="0"
        max="1"
        oninput="updateCenterFromInput()"
      />
    </div>

    <div id="canvas-holder">
      <canvas
        width="600"
        height="600"
        id="webglcanvas"
        style="background-color: red"
      ></canvas>
    </div>
  </body>
</html>
